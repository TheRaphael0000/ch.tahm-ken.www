name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAR: "tahm-ken.ch-${{ github.ref_name }}.tar"

    container:
      image: ghcr.io/theraphael0000/ch.tahm-ken.www:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        run: VITE_BUILD_VERSION=${{ github.ref_name }} ./docker_build.sh

      - name: Archiving build
        run: (cd build && tar -cvf ../$RELEASE_TAR .)

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref }} \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes \
          ./$RELEASE_TAR